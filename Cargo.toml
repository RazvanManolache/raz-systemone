[package]
name = "systemone"
version = "0.1.0"
edition = "2021"
description = "Jev-like typed decisions over local models: probabilities for answers, not text"
license = "MIT"
repository = "https://github.com/RazvanManolache/systemone"
readme = "README.md"
keywords = ["nlp", "nli", "calibration", "llm"]
categories = ["command-line-utilities", "web-programming"]

[dependencies]
anyhow = "1"
axum = "0.8.9"
candle-core = "0.11"
candle-nn = "0.11"
candle-transformers = "0.11"
clap = { version = "4", features = ["derive"] }
futures = "0.3"
hf-hub = { version = "1.0.0", features = ["blocking"] }
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokenizers = "0.23.2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time"] }
