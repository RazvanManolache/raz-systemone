name: Build binaries

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: never

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
        - os: windows-2022
          platform: windows-x64
          executable: raz.exe
        - os: ubuntu-24.04
          platform: linux-x64
          executable: raz
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
    - uses: actions/checkout@v7.0.1
    - uses: dtolnay/rust-toolchain@stable
    - name: Run offline tests
      run: cargo test --locked --release
    - name: Build release executable
      run: cargo build --locked --release
    - name: Smoke test executable
      run: ./target/release/${{ matrix.executable }} --help
    - name: Verify Windows runtime linkage
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $vswhere = "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe"
        $dumpbin = & $vswhere -latest -products '*' -find 'VC/Tools/MSVC/**/bin/Hostx64/x64/dumpbin.exe' | Sort-Object -Descending | Select-Object -First 1
        if (!$dumpbin) { throw 'Cannot locate the Windows binary inspection tool.' }
        $dependencies = & $dumpbin /dependents target/release/raz.exe
        if ($LASTEXITCODE) { throw 'Cannot inspect Windows runtime dependencies.' }
        $dependencies | Write-Output
        if ($dependencies -match '(?i)(VCRUNTIME|MSVCP|MSVCR|ucrtbase|api-ms-win-crt).*\.dll') {
          throw 'The portable Windows binary unexpectedly depends on a dynamic C/C++ runtime.'
        }
    - name: Package binary, examples and documentation
      shell: pwsh
      env:
        BUILD_PLATFORM: ${{ matrix.platform }}
        BUILD_EXECUTABLE: ${{ matrix.executable }}
      run: |
        $ErrorActionPreference = 'Stop'
        $name = "raz-$env:BUILD_PLATFORM"
        $stage = "dist/$name"
        New-Item -ItemType Directory -Force $stage | Out-Null
        Copy-Item "target/release/$env:BUILD_EXECUTABLE", README.md, LICENSE -Destination $stage
        Copy-Item examples -Destination $stage -Recurse
        $env:GITHUB_SHA | Set-Content "$stage/BUILD-COMMIT.txt"
        if ($IsWindows) {
          $archive = "$name.zip"
          Compress-Archive -Path $stage -DestinationPath "dist/$archive"
        } else {
          $archive = "$name.tar.gz"
          tar -czf "dist/$archive" -C dist $name
          if ($LASTEXITCODE) { throw 'Archive creation failed.' }
        }
        "$( (Get-FileHash "dist/$archive" -Algorithm SHA256).Hash.ToLowerInvariant() )  $archive" | Set-Content dist/SHA256SUMS.txt
    - uses: actions/github-script@v9
      with:
        script: |
          const publish = require('./.github/scripts/publish-build.cjs');
          await publish({github, context, core, glob, exec});
      env:
        BUILD_NAME: raz-${{ matrix.platform }}
        BUILD_PATHS: |
          dist/*.zip
          dist/*.tar.gz
          dist/SHA256SUMS.txt
        BUILD_HIDDEN: 'false'
        BUILD_MISSING: error
      if: (success()) && success() && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && github.event_name != 'pull_request'
    permissions:
      contents: write

